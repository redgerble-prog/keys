# =====================================================================
# CALLER WORKFLOW - copy this into EVERY new app repo at:
#   .github/workflows/build-signed-apk.yml
# Replace YOUR_USERNAME with your GitHub username.
# That's it - the reusable workflow signs your APK automatically.
# =====================================================================

name: Build Signed APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    uses: YOUR_USERNAME/keys/.github/workflows/reusable-sign-apk.yml@main
    secrets: inherit