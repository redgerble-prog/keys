# =====================================================================
# REUSABLE WORKFLOW - builds and signs your release APK.
#
# Place this file at:  .github/workflows/reusable-sign-apk.yml
# in your KEYS/template repo, and make that repo PUBLIC
# (it contains no secrets, only config).
#
# App repos then call it with a tiny caller workflow (see
# app-caller-workflow.yml in this folder).
# =====================================================================

name: Reusable Signed APK Build

on:
  workflow_call:

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing keystore from secret
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > release.keystore

      - name: Write Gradle signing init script
        run: |
          cat > signing.init.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application")) {
                      def androidExt = project.extensions.findByName("android")
                      def envPath = System.getenv("ANDROID_KEYSTORE_PATH")
                      def envStorePass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      def envAlias = System.getenv("ANDROID_KEY_ALIAS")
                      def envKeyPass = System.getenv("ANDROID_KEY_PASSWORD")
                      if (envPath && envStorePass && envAlias && envKeyPass) {
                          androidExt.signingConfigs {
                              release {
                                  storeFile new File(envPath)
                                  storePassword envStorePass
                                  keyAlias envAlias
                                  keyPassword envKeyPass
                              }
                          }
                          androidExt.buildTypes.release.signingConfig = androidExt.signingConfigs.release
                      }
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew -I signing.init.gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/*.apk